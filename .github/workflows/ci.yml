name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      # Includes the cross-tenant isolation suite, the redaction corpus and the
      # MCP end-to-end test (Testcontainers Postgres).
      - run: pnpm test
      - run: pnpm --filter @mm/web build
      - run: pnpm --filter @mm/api build && pnpm --filter @mm/worker build
      - name: Bridge builds and runs
        run: pnpm --filter @mm/bridge build && node apps/bridge/dist/mm.js --version
      - name: Services image builds
        run: docker build -f apps/api/Dockerfile -t mastermind-services:ci .
      - name: CDK synth (account-agnostic)
        run: pnpm --filter @mm/infra synth
